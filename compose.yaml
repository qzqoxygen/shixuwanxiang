name: shixu
services:
  app:
    image: shixu-ai:${APP_TAG:?Set APP_TAG to the release tag}
    build: .
    pull_policy: never
    env_file: ${APP_ENV_FILE:-/etc/shixu/app.env}
    environment:
      SHIXU_TRUST_PROXY: "1"
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    logging:
      driver: local
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/cultural-cases?limit=1').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2.11.9-alpine
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN to the public hostname}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/shixu/caddy/data:/data
      - /var/lib/shixu/caddy/config:/config
    restart: unless-stopped
    logging:
      driver: local
